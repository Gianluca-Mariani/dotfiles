# --- PREFIX ---
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# --- SPLIT PANES ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config file
bind r source-file ~/.tmux.conf \; display "Tmux config reloaded!"

# --- PANE NAVIGATION ---
# Switch panes using Alt + hjkl without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Seamless navigation between Neovim splits and Tmux panes (Ctrl + hjkl)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# --- QUALITY OF LIFE ---
set -g mouse on
set-option -g allow-rename off

# Color support for Neovim (Tokyonight)
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"

# --- DYNAMIC CROSS-PLATFORM CLIPBOARD ---
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection

# Detect OS and apply the correct clipboard command automatically:
# - macOS: pbcopy
# - Linux (Wayland): wl-copy
# - Linux (X11): xclip
if-shell "uname | grep -q Darwin" \
  "bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "if-shell '[ -n \"$WAYLAND_DISPLAY\" ]' \
    'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \"wl-copy\"' \
    'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \"xclip -selection clipboard -in\"'"

# --- DESIGN TWEAKS ---
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

setw -g clock-mode-colour yellow
setw -g mode-style 'fg=black bg=red bold'

# Panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# Statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=yellow'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# Messages
set -g message-style 'fg=yellow bg=red bold'
